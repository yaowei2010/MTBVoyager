services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性 restore public tables/data（自動略過 "CREATE SCHEMA public"）
  db_restore_public:
    profiles: ["restore"]
    image: postgres:16
    container_name: db_restore_public
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./public_schema_clean.dump:/dump/public_schema.dump:ro
      # 這個資料夾用來放 list（可寫）
      - ./dbrestore_work:/work
    command:
      - bash
      - -lc
      - |
        set -e
        echo "[restore] checking..."

        # ✅ 用你一定存在的表當作判斷條件（避免每次都 restore）
        if psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc "SELECT to_regclass('public.blacklist_ori')" | grep -q blacklist_ori; then
          echo "[restore] already restored, skip"
          exit 0
        fi

        echo "[restore] generate list..."
        pg_restore -l /dump/public_schema.dump > /work/public_schema.list

        # 註解掉 "SCHEMA - public"（避免 CREATE SCHEMA public; 失敗）
        # 只略過 public schema 本體，public 內的 tables/objects 仍會 restore
        sed -i 's/^[0-9].*SCHEMA - public .*$/;&/' /work/public_schema.list

        echo "[restore] start"
        pg_restore -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} --no-owner --exit-on-error -L /work/public_schema.list /dump/public_schema.dump
        echo "[restore] done"
    restart: "no"

  backend:
    image: takeshi945/nckumtb:backend-wgs-germline-20260722-acmg-sf-v33
    pull_policy: never
    build:
      context: ../../backend_wgs
      dockerfile: Dockerfile
      additional_contexts:
        wgs_somatic: ../../backend_wgs_somatic
    container_name: backend
    working_dir: /miRTI
    command: ["bash", "-lc", "python manage.py runserver 0.0.0.0:8217"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST_VEP_DIR: "${DATA_ROOT}/VEP"
      HOST_TMP_DIR: "${DATA_ROOT}/tmp"
      PG_HOST: "postgres"
      PG_PORT: "5432"
      PG_DB: "${POSTGRES_DB}"
      PG_USER: "${POSTGRES_USER}"
      PG_PW: "${POSTGRES_PASSWORD}"
      WGS_DATA_ROOT: "${DATA_ROOT}/wgs_germline"
      WGS_SOMATIC_DATA_ROOT: "${DATA_ROOT}/wgs_somatic"
      WGS_REFERENCE_FASTA: "${WGS_REFERENCE_ROOT}/hg38.fa"
      WGS_VEP_CACHE: "${DATA_ROOT}/VEP/database"
      WGS_VEP_PLUGIN_DATA: "${DATA_ROOT}/VEP/database/Plugins"
      WGS_VEP_PLUGIN_ARGS: "${WGS_VEP_PLUGIN_ARGS}"
      WGS_VEP_MAX_PARALLEL: "${WGS_VEP_MAX_PARALLEL:-5}"
      WGS_VEP_FORK_PER_SHARD: "${WGS_VEP_FORK_PER_SHARD:-6}"
      WGS_CANCER_DB: "${DATA_ROOT}/VEP/20241126Mondodatabase"
      WGS_ANNOTSV_ANNOTATIONS: "${DATA_ROOT}/annotsv/database/Annotations_Human"
      WGS_ONCOVI_RESOURCES: "${DATA_ROOT}/oncovi/99fa5801163bb6bd32d97e916ca2249bb9429d81/resources"
      MONDO_TERMS_TSV: "${DATA_ROOT}/mondo/mondo_terms.tsv"
      MONDO_GENE_ASSOCIATIONS_TSV: "${DATA_ROOT}/mondo/mondo_gene_associations.tsv"
      MONDO_RELEASE_FILE: "${DATA_ROOT}/mondo/release.json"
      LITERATURE_RAG_DB: "${DATA_ROOT}/literature_rag/literature.sqlite3"
      LITERATURE_LLM_URL: "http://literature_llm:8080/v1/chat/completions"
      LITERATURE_LLM_MODEL: "${LITERATURE_LLM_MODEL:-local-medical-instruct}"
      NCBI_EMAIL: "${NCBI_EMAIL:-}"
    volumes:
      - ${DATA_ROOT}/VEP:/VEP
      - ${DATA_ROOT}/annovar/annovar:/annovar
      - ${DATA_ROOT}/annotsv:/annotsv
      - ${DATA_ROOT}/media:/miRTI/media
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/tmp:${DATA_ROOT}/tmp
      - ${DATA_ROOT}:${DATA_ROOT}
      - ${WGS_REFERENCE_ROOT}:${WGS_REFERENCE_ROOT}:ro
      - ${DATA_ROOT}/backend/db.sqlite3:/miRTI/db.sqlite3
    # 如果你要從宿主機直接打到 Django，打開這行
    # ports:
    #   - "8217:8217"
    restart: unless-stopped

  literature_llm:
    profiles: ["literature-llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: literature_llm
    command: ["-m", "/models/${LITERATURE_LLM_MODEL_FILE:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "-np", "1", "-t", "${LITERATURE_LLM_THREADS:-16}"]
    volumes:
      - ${LITERATURE_MODEL_ROOT:-./models}:/models:ro
    restart: unless-stopped

  wgs_tools:
    profiles: ["build-only"]
    image: ncku-wgs-python:20260721
    pull_policy: never
    build:
      context: ../../backend_wgs
      dockerfile: Dockerfile.tools
    command: ["python", "--version"]

  frontend:
    image: takeshi945/nckumtb:frontend-clinical-ui-20260722-acmg-sf-v33
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile.runtime
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3002:80"
    restart: unless-stopped

  gateway:
    image: takeshi945/nckumtb:frontend-clinical-ui-20260722-acmg-sf-v33
    pull_policy: never
    container_name: gateway
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/app.conf:ro
      - ./tls/platform.crt:/etc/nginx/tls/platform.crt:ro
      - ./tls/platform.key:/etc/nginx/tls/platform.key:ro
    restart: unless-stopped

volumes:
  pgdata:

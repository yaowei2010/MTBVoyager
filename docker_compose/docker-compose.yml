services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性 restore public tables/data（自動略過 "CREATE SCHEMA public"）
  db_restore_public:
    profiles: ["restore"]
    image: postgres:16
    container_name: db_restore_public
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./public_schema_clean.dump:/dump/public_schema.dump:ro
      # 這個資料夾用來放 list（可寫）
      - ./dbrestore_work:/work
    command:
      - bash
      - -lc
      - |
        set -e
        echo "[restore] checking..."

        # ✅ 用你一定存在的表當作判斷條件（避免每次都 restore）
        if psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc "SELECT to_regclass('public.blacklist_ori')" | grep -q blacklist_ori; then
          echo "[restore] already restored, skip"
          exit 0
        fi

        echo "[restore] generate list..."
        pg_restore -l /dump/public_schema.dump > /work/public_schema.list

        # 註解掉 "SCHEMA - public"（避免 CREATE SCHEMA public; 失敗）
        # 只略過 public schema 本體，public 內的 tables/objects 仍會 restore
        sed -i 's/^[0-9].*SCHEMA - public .*$/;&/' /work/public_schema.list

        echo "[restore] start"
        pg_restore -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} --no-owner --exit-on-error -L /work/public_schema.list /dump/public_schema.dump
        echo "[restore] done"
    restart: "no"

  backend:
    image: takeshi945/nckumtb:backend-20260701
    container_name: backend
    working_dir: /miRTI
    command: ["bash", "-lc", "python manage.py runserver 0.0.0.0:8217"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST_VEP_DIR: "${DATA_ROOT}/VEP"
      HOST_TMP_DIR: "${DATA_ROOT}/tmp"
      PG_HOST: "postgres"
      PG_PORT: "5432"
      PG_DB: "${POSTGRES_DB}"
      PG_USER: "${POSTGRES_USER}"
      PG_PW: "${POSTGRES_PASSWORD}"
    volumes:
      - ${DATA_ROOT}/VEP:/VEP
      - ${DATA_ROOT}/annovar/annovar:/annovar
      - ${DATA_ROOT}/annotsv:/annotsv
      - ${DATA_ROOT}/media:/miRTI/media
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT}/tmp:${DATA_ROOT}/tmp
    # 如果你要從宿主機直接打到 Django，打開這行
    # ports:
    #   - "8217:8217"
    restart: unless-stopped

  frontend:
    image: takeshi945/nckumtb:frontend-wgs-buttons-20260714
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3002:80"
    restart: unless-stopped

volumes:
  pgdata:

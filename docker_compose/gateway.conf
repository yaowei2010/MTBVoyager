server {
  listen 80;
  server_name 140.116.66.190;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name 140.116.66.190;
  client_max_body_size 0;

  ssl_certificate /etc/nginx/tls/platform.crt;
  ssl_certificate_key /etc/nginx/tls/platform.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location = / {
    return 302 /variant/login;
  }

  location = /hrd-transfer {
    return 301 /hrd-transfer/;
  }

  location ^~ /hrd-transfer/ {
    auth_basic "HRD transfer";
    auth_basic_user_file /etc/nginx/auth/hrd-transfer.htpasswd;
    alias /srv/hrd-transfer/;
    autoindex on;
    autoindex_exact_size off;
    default_type application/octet-stream;
    add_header Accept-Ranges bytes always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /mxic-transfer {
    return 301 /mxic-transfer/;
  }

  location ^~ /mxic-transfer/ {
    auth_basic "MXIC transfer";
    auth_basic_user_file /etc/nginx/auth/hrd-transfer.htpasswd;
    alias /srv/mxic-table/;
    autoindex on;
    autoindex_exact_size off;
    default_type application/octet-stream;
    add_header Accept-Ranges bytes always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 30s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
  }
}

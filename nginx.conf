server {
  listen 80;
  server_name _;
  client_max_body_size 0;


  root /usr/share/nginx/html;
  index index.html;

  # 1) API Proxy：前端 axios 打 /ncku_hospital/...，轉給 backend service
  location /ncku_hospital/ {
      # ★ 這裡使用 docker-compose 的 service 名稱 + 容器內部 port
      proxy_pass http://backend:8217;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /variant/pdf.worker.mjs {
      # 將 /variant/pdf.worker.mjs 映射到真正的 /pdf.worker.mjs 檔案
      rewrite ^/variant/(.*)$ /$1 break;
      default_type text/javascript;
      try_files /pdf.worker.mjs =404;
  }
  # 2) .mjs：強制用 JS MIME
  location ~* \.mjs$ {
    default_type text/javascript;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }

  # 3) 靜態檔：直接 404（不要兜回 index.html）
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
  }

  # 4) CRA 掛在 /variant（配合你 package.json 的 "homepage": "/variant"）
  location ^~ /variant/ {
    # 把 /variant/xxx 改寫成 /xxx 再去找檔案
    rewrite ^/variant/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # 5) /static 資源
  location ~* ^/static/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # 6) 根路徑 fallback（看你有沒有直接用 / 開）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
